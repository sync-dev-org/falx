[project]
name = "falx"
dynamic = ["version"]
description = "Python library and CLI wrapper for fal.ai queue APIs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "minamikik", email = "minamikik@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fal-client>=0.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "opencv-python-headless>=4.13.0.92",
    "pykakasi>=2.3.0",
]

[project.scripts]
falx = "falx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/falx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests that hit the real fal.ai API (requires FAL_KEY, opt-in via -m e2e)",
]
